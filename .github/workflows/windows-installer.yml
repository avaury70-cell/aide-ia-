# Fabrique l'installateur Windows d'Aide et le publie dans l'onglet « Releases » du dépôt.
name: Installateur Windows

on:
  push:
    branches: [main, claude/smart-home-assistant-architecture-d8lj2d]
    paths: ["desktop/**", ".github/workflows/windows-installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Aide-Windows
          path: desktop/release/Aide-Installation-*.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aide-windows-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Aide pour Windows (version ${{ github.run_number }})
          body: |
            Téléchargez **Aide-Installation-1.0.0.exe** ci-dessous, puis double-cliquez dessus.
            Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          files: desktop/release/Aide-Installation-*.exe
